<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Drone Threat Trainer</title>
<style>
  body { font-family: system-ui, sans-serif; background: #05070a; color: #d7dde3; margin: 0; }
  header { padding: 12px 20px; border-bottom: 1px solid #1f2733; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header select, header button, header input { background: #0e141c; color: #d7dde3; border: 1px solid #1f2733; border-radius: 4px; padding: 6px 10px; }
  main { display: flex; }
  #scope { background: radial-gradient(circle, #0a2a12 0%, #04140a 70%, #020a05 100%); border-right: 1px solid #1f2733; }
  #sidebar { width: 380px; padding: 16px; height: calc(100vh - 80px); overflow-y: auto; box-sizing: border-box; }
  .contact-row { border: 1px solid #1f2733; border-radius: 6px; padding: 8px; margin-bottom: 8px; background: rgba(14,20,28,0.5); }
  .contact-row.selected { border-color: #58a6ff; }
  .contact-row button { margin-right: 4px; margin-top: 6px; }
  select.cls { width: 100%; margin-top: 4px; }
  #result { font-size: 13px; background: #0e141c; padding: 12px; border-radius: 6px; border: 1px solid #1f2733; }
  .blip { fill: #3fb950; }
  .blip.tagged { fill: #58a6ff; }
  #timer { font-variant-numeric: tabular-nums; font-size: 18px; }
  .zone { fill: #f85149; fill-opacity: 0.12; stroke: #f85149; stroke-opacity: 0.6; stroke-dasharray: 10 6; }
  .asset { fill: #d29922; }
  #roeCard { font-size: 12px; color: #8b949e; padding: 8px 16px; border-bottom: 1px solid #1f2733; background: #080c12; }

  #finishBtn {
    background: linear-gradient(135deg, #238636, #2ea043);
    color: #fff;
    font-weight: 700;
    border: 1px solid #3fb950;
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    box-shadow: 0 0 12px rgba(63, 185, 80, 0.25);
    transition: all 0.2s;
  }
  #finishBtn:hover:not(:disabled) {
    box-shadow: 0 0 18px rgba(63, 185, 80, 0.45);
    transform: translateY(-1px);
  }
  #finishBtn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    box-shadow: none;
    transform: none;
  }
  #statusBanner {
    display: none;
    padding: 10px 20px;
    font-size: 13px;
    font-weight: 500;
    border-bottom: 1px solid #1f2733;
    align-items: center;
    justify-content: space-between;
  }
  #scoreModal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(5, 7, 10, 0.85);
    backdrop-filter: blur(8px);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
    box-sizing: border-box;
  }
  .score-card {
    background: #0d1117;
    border: 1px solid #30363d;
    border-radius: 12px;
    width: 100%;
    max-width: 680px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.85);
    overflow: hidden;
    color: #d7dde3;
  }
  .score-header {
    padding: 16px 24px;
    background: #161b22;
    border-bottom: 1px solid #30363d;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .score-body {
    padding: 24px;
    max-height: 80vh;
    overflow-y: auto;
  }
  .metric-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin: 16px 0;
  }
  .metric-item {
    background: #161b22;
    border: 1px solid #21262d;
    border-radius: 8px;
    padding: 12px 16px;
  }
  .metric-val {
    font-size: 20px;
    font-weight: 700;
    margin-top: 4px;
  }
  .metric-bar-bg {
    background: #21262d;
    height: 6px;
    border-radius: 3px;
    margin-top: 8px;
    overflow: hidden;
  }
  .metric-bar-fill {
    height: 100%;
    border-radius: 3px;
    transition: width 0.6s ease;
  }
</style>
</head>
<body>
<header>
  <strong>Drone Threat Trainer</strong>
  <label>Trainee ID <input id="traineeId" value="trainee-1" /></label>
  <label>Unit ID <input id="unitId" value="unit-A" /></label>
  <label>Difficulty
    <select id="difficulty"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select>
  </label>
  <label>Time of day
    <select id="timeOfDay"><option>day</option><option>night</option><option>dusk</option></select>
  </label>
  <label>Terrain
    <select id="terrain"><option>rural</option><option>urban</option><option>coastal</option><option>mountain</option></select>
  </label>
  <label>Sensor degradation
    <select id="degradation"><option value="0">none</option><option value="0.3">moderate</option><option value="0.6">severe</option></select>
  </label>
  <label title="Enrolls you in the AAR-timing and scenario-sequencing studies (see research/PROTOCOLS.md) — your scored sessions get tagged with a study arm for later analysis.">
    <input type="checkbox" id="participateResearch" /> Participate in research
  </label>
  <label title="Feints, swarm splitting, terrain-masked low approaches, RF-silent drones, decoy saturation">
    <input type="checkbox" id="redTeamTactics" /> Red-team tactics
  </label>
  <button onclick="startScenario()" style="border-color:#3fb950;color:#4DFFA8;">New procedural scenario</button>
  <button onclick="startAdaptive()" title="Weights the scenario toward whatever you've scored worst on in past sessions">Adaptive scenario</button>
  <label>Scripted drill
    <select id="scriptedDrill"><option value="">-- select --</option></select>
  </label>
  <button onclick="startScripted()">Load drill</button>
  <span id="timer">00:00</span>
  <button id="finishBtn" onclick="finishSession()">Finish &amp; score</button>
  <a href="/vr" style="color:#58a6ff">VR mode →</a>
  <a href="/instructor" style="color:#58a6ff">Instructor console →</a>
  <a href="/team" style="color:#58a6ff">Team roles →</a>
  <a href="/aar" style="color:#58a6ff">AAR dashboard →</a>
  <a href="http://localhost:3000/" target="_blank" rel="noopener" style="color:#58a6ff" title="Optional separate service — run start_radar_analytics.bat/.sh first">Radar Analytics →</a>
</header>
<div id="roeCard">No scenario loaded — ROE card and no-engage zones will appear here.</div>
<div id="statusBanner"></div>
<main>
  <svg id="scope" width="760" height="760" viewBox="-3000 -3000 6000 6000"></svg>
  <div id="sidebar">
    <h3>Contacts</h3>
    <div id="contactList"></div>
    <h3>Result</h3>
    <div id="result">No session scored yet.</div>
  </div>
</main>
<div id="scoreModal"></div>

<script>
let scenario = null;       // sanitized (client) scenario
let simStart = null;       // Date.now() at scenario start
let elapsed = 0;
let tickHandle = null;
let refreshHandle = null;
let log = {};              // contact_id -> {detected_at, classification, engagement_action}
const CLASS_OPTIONS = ["hostile_drone", "hostile_swarm_member", "friendly_drone", "decoy", "bird"];

function fmtTime(s) {
  const m = Math.floor(s / 60).toString().padStart(2, '0');
  const ss = Math.floor(s % 60).toString().padStart(2, '0');
  return `${m}:${ss}`;
}

function readScenarioParams() {
  return {
    difficulty: parseInt(document.getElementById('difficulty').value),
    time_of_day: document.getElementById('timeOfDay').value,
    terrain: document.getElementById('terrain').value,
    sensor_degradation: parseFloat(document.getElementById('degradation').value),
    red_team_tactics: document.getElementById('redTeamTactics').checked ? true : null,
  };
}

function onScenarioStarted(label) {
  log = {};
  elapsed = 0;
  simStart = Date.now();
  renderContactList();
  renderRoeCard();
  document.getElementById('result').innerHTML = `<div style="color:#8b949e; padding:6px;">${label}</div>`;
  const finishBtn = document.getElementById('finishBtn');
  if (finishBtn) {
    finishBtn.disabled = false;
    finishBtn.innerHTML = "Finish &amp; score";
  }
  const modal = document.getElementById('scoreModal');
  if (modal) modal.style.display = 'none';
  const banner = document.getElementById('statusBanner');
  if (banner) banner.style.display = 'none';
  if (tickHandle) clearInterval(tickHandle);
  tickHandle = setInterval(tick, 200);
  if (refreshHandle) clearInterval(refreshHandle);
  refreshHandle = setInterval(pollInstructorUpdates, 3000);
}

// picks up instructor-injected threats and sensor-outage changes (instructor
// console, roadmap feature 8) without a full reload
async function pollInstructorUpdates() {
  if (!scenario) return;
  try {
    const fresh = await fetch(`/api/scenario/${scenario.scenario_id}/refresh`).then(r => r.json());
    const knownIds = new Set(scenario.contacts.map(c => c.contact_id));
    const newOnes = fresh.contacts.filter(c => !knownIds.has(c.contact_id));
    if (newOnes.length) scenario.contacts.push(...newOnes);
    if (fresh.sensor_outage !== scenario.sensor_outage) {
      scenario.sensor_outage = fresh.sensor_outage;
      renderRoeCard();
    }
  } catch (e) { /* scenario may have ended server-side; ignore */ }
}

async function startScenario() {
  const res = await fetch('/api/scenario/new', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(readScenarioParams())
  });
  scenario = await res.json();
  onScenarioStarted('Session in progress...');
}

async function startAdaptive() {
  const trainee_id = document.getElementById('traineeId').value || 'trainee-1';
  const body = { trainee_id, ...readScenarioParams() };
  const res = await fetch('/api/scenario/adaptive', {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
  });
  scenario = await res.json();
  const weights = scenario.applied_type_weights || {};
  const weightText = Object.keys(weights).length
    ? `Weighted toward your weak spots: ${JSON.stringify(weights)}`
    : 'No session history yet — same as a normal procedural scenario.';
  onScenarioStarted(`Adaptive session in progress. ${weightText}`);
}

async function loadScriptedList() {
  const names = await fetch('/api/scenario/scripted').then(r => r.json());
  const sel = document.getElementById('scriptedDrill');
  for (const n of names) {
    const opt = document.createElement('option');
    opt.value = n; opt.textContent = n;
    sel.appendChild(opt);
  }

  // Parse URL query parameters from landing page
  const params = new URLSearchParams(window.location.search);
  if (params.get('difficulty')) document.getElementById('difficulty').value = params.get('difficulty');
  if (params.get('timeOfDay')) document.getElementById('timeOfDay').value = params.get('timeOfDay');
  if (params.get('terrain')) document.getElementById('terrain').value = params.get('terrain');

  const drillParam = params.get('drill');
  const normalizedParam = drillParam ? drillParam.trim().replace(/\s+/g, '_') : '';
  const matched = names.find(n => n === drillParam || n === normalizedParam);
  if (matched) {
    sel.value = matched;
    startScripted();
  } else if (params.get('autostart') === '1') {
    startScenario();
  }
}
loadScriptedList();

async function startScripted() {
  const name = document.getElementById('scriptedDrill').value;
  if (!name) return;
  const res = await fetch(`/api/scenario/scripted/${encodeURIComponent(name)}`, { method: 'POST' });
  scenario = await res.json();
  onScenarioStarted(`Scripted drill "${name}" in progress...`);
}

function renderRoeCard() {
  const el = document.getElementById('roeCard');
  if (!scenario || !scenario.roe_card) { el.textContent = 'No ROE card for this scenario.'; return; }
  const roe = scenario.roe_card;
  const zones = (scenario.no_engage_zones || []).map(z => z.name).join(', ') || 'none';
  const outage = scenario.sensor_outage
    ? `<strong style="color:#f85149">Sensor outage this scenario: ${scenario.sensor_outage} is jammed/unavailable — cross-cue with the others.</strong> `
    : '';
  el.innerHTML = outage + `<strong>ROE:</strong> warn required before hard-kill unless target is within `
    + `${roe.time_critical_override_s}s of impact (self-defense exception). `
    + `Hard-kill max range ${roe.max_hard_kill_range_m}m, soft-kill max range ${roe.max_soft_kill_range_m}m. `
    + `Hard-kill is <strong>prohibited</strong> inside no-engage zones: ${zones} (shown as red dashed circles on the scope).`;
}

function tick() {
  elapsed = (Date.now() - simStart) / 1000;
  document.getElementById('timer').textContent = fmtTime(elapsed);
  drawScope();
  if (elapsed >= scenario.duration_s) {
    if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
    if (refreshHandle) { clearInterval(refreshHandle); refreshHandle = null; }
    showBanner(`⏱️ Simulation Time Expired (${scenario.duration_s}s) — All contacts have completed flight paths. Click 'Finish & score' to evaluate your session!`, 'warning');
    const finishBtn = document.getElementById('finishBtn');
    if (finishBtn) finishBtn.style.boxShadow = '0 0 20px rgba(63, 185, 80, 0.8)';
  }
}

function posAt(contact, t) {
  const pts = contact.path;
  if (t <= pts[0].t) return pts[0];
  if (t >= pts[pts.length - 1].t) return pts[pts.length - 1];
  for (let i = 0; i < pts.length - 1; i++) {
    const a = pts[i], b = pts[i + 1];
    if (a.t <= t && t <= b.t) {
      const f = b.t === a.t ? 0 : (t - a.t) / (b.t - a.t);
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    }
  }
  return pts[pts.length - 1];
}

function drawScope() {
  const svg = document.getElementById('scope');
  svg.innerHTML = '';

  // Tactical Range Rings (1km, 2km, 3km) & Crosshairs
  const rings = [1000, 2000, 2900];
  for (const r of rings) {
    const c = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    c.setAttribute('cx', 0); c.setAttribute('cy', 0); c.setAttribute('r', r);
    c.setAttribute('stroke', 'rgba(63, 185, 80, 0.25)');
    c.setAttribute('stroke-width', '2');
    c.setAttribute('fill', 'none');
    c.setAttribute('stroke-dasharray', '6 6');
    svg.appendChild(c);

    const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    txt.setAttribute('x', 15); txt.setAttribute('y', -r + 20);
    txt.setAttribute('fill', 'rgba(63, 185, 80, 0.5)');
    txt.setAttribute('font-size', '44');
    txt.setAttribute('font-family', 'monospace');
    txt.textContent = `${Math.round(r/1000)}KM`;
    svg.appendChild(txt);
  }

  // Crosshairs
  const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  hLine.setAttribute('x1', -3000); hLine.setAttribute('y1', 0); hLine.setAttribute('x2', 3000); hLine.setAttribute('y2', 0);
  hLine.setAttribute('stroke', 'rgba(63, 185, 80, 0.15)'); hLine.setAttribute('stroke-width', '2');
  svg.appendChild(hLine);

  const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  vLine.setAttribute('x1', 0); vLine.setAttribute('y1', -3000); vLine.setAttribute('x2', 0); vLine.setAttribute('y2', 3000);
  vLine.setAttribute('stroke', 'rgba(63, 185, 80, 0.15)'); vLine.setAttribute('stroke-width', '2');
  svg.appendChild(vLine);

  // Rotating Radar Sweep Beam
  const sweepAngle = (elapsed * 90) % 360; // 90 deg/sec sweep
  const rad = (sweepAngle * Math.PI) / 180;
  const sx = Math.sin(rad) * 3000;
  const sy = -Math.cos(rad) * 3000;
  const sweep = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  sweep.setAttribute('x1', 0); sweep.setAttribute('y1', 0); sweep.setAttribute('x2', sx); sweep.setAttribute('y2', sy);
  sweep.setAttribute('stroke', 'rgba(77, 255, 168, 0.45)'); sweep.setAttribute('stroke-width', '3');
  svg.appendChild(sweep);

  if (!scenario) {
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('x', -1400); bg.setAttribute('y', -350);
    bg.setAttribute('width', 2800); bg.setAttribute('height', 700);
    bg.setAttribute('fill', 'rgba(14, 20, 28, 0.88)');
    bg.setAttribute('stroke', '#30363d'); bg.setAttribute('stroke-width', '4');
    bg.setAttribute('rx', '20');
    svg.appendChild(bg);

    const title = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    title.setAttribute('x', 0); title.setAttribute('y', -80);
    title.setAttribute('text-anchor', 'middle');
    title.setAttribute('fill', '#4DFFA8');
    title.setAttribute('font-size', '120');
    title.setAttribute('font-weight', 'bold');
    title.setAttribute('font-family', 'system-ui, sans-serif');
    title.textContent = 'RADAR SYSTEM STANDBY';
    svg.appendChild(title);

    const sub = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub.setAttribute('x', 0); sub.setAttribute('y', 60);
    sub.setAttribute('text-anchor', 'middle');
    sub.setAttribute('fill', '#8b949e');
    sub.setAttribute('font-size', '72');
    sub.setAttribute('font-family', 'system-ui, sans-serif');
    sub.textContent = 'Click "New procedural scenario" or select a "Scripted drill"';
    svg.appendChild(sub);

    const sub2 = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    sub2.setAttribute('x', 0); sub2.setAttribute('y', 170);
    sub2.setAttribute('text-anchor', 'middle');
    sub2.setAttribute('fill', '#58a6ff');
    sub2.setAttribute('font-size', '70');
    sub2.setAttribute('font-family', 'system-ui, sans-serif');
    sub2.textContent = 'in the top bar above to start training';
    svg.appendChild(sub2);
    return;
  }

  for (const zone of (scenario.no_engage_zones || [])) {
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', zone.center[0]);
    circle.setAttribute('cy', zone.center[1]);
    circle.setAttribute('r', zone.radius_m);
    circle.setAttribute('class', 'zone');
    svg.appendChild(circle);
  }

  const [ax, ay] = scenario.defended_asset_position || [0, 0];
  const asset = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  asset.setAttribute('x', ax - 40); asset.setAttribute('y', ay - 40);
  asset.setAttribute('width', 80); asset.setAttribute('height', 80);
  asset.setAttribute('class', 'asset');
  asset.setAttribute('rx', 8);
  svg.appendChild(asset);

  for (const c of scenario.contacts) {
    if (elapsed < c.spawn_t || elapsed > c.despawn_t) continue;
    const p = posAt(c, elapsed);
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', p.x);
    circle.setAttribute('cy', p.y);
    circle.setAttribute('r', 36);
    circle.setAttribute('class', 'blip' + (log[c.contact_id] ? ' tagged' : ''));
    circle.style.cursor = 'pointer';
    circle.onclick = () => tagDetected(c.contact_id);
    svg.appendChild(circle);

    // Blip ID label on scope
    const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    lbl.setAttribute('x', p.x + 45); lbl.setAttribute('y', p.y + 12);
    lbl.setAttribute('fill', log[c.contact_id] ? '#58a6ff' : '#3fb950');
    lbl.setAttribute('font-size', '40');
    lbl.setAttribute('font-family', 'monospace');
    lbl.textContent = c.contact_id;
    svg.appendChild(lbl);
  }
}

function tagDetected(contactId) {
  if (!log[contactId]) log[contactId] = { contact_id: contactId };
  if (log[contactId].detected_at === undefined) {
    log[contactId].detected_at = elapsed;
  }
  renderContactList();
  drawScope();
}

function setClassification(contactId, value) {
  if (!log[contactId]) log[contactId] = { contact_id: contactId, detected_at: elapsed };
  log[contactId].classification = value;
}

async function setEngagement(contactId, action) {
  if (!log[contactId]) log[contactId] = { contact_id: contactId, detected_at: elapsed };
  const entry = log[contactId];

  if (action === 'warn') {
    entry.warn_at = elapsed;
    renderContactList();
    return;
  }

  // the graduated-response ladder's decisive step: monitor/ignore/soft_kill/hard_kill
  entry.engagement_action = action;
  entry.engagement_at = elapsed;
  renderContactList();

  if (action !== 'hard_kill' || !scenario) return;
  // live-reactive swarm: if this is an ares-driven swarm member, the real
  // recovery/relay logic reacts to the kill right now, not just at scoring time
  const res = await fetch('/api/contact/engage', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ scenario_id: scenario.scenario_id, contact_id: contactId, t: elapsed, action }),
  });
  const out = await res.json();
  if (out.reactive) {
    const byId = Object.fromEntries(scenario.contacts.map(c => [c.contact_id, c]));
    for (const updated of out.contacts) byId[updated.contact_id] = updated;
    scenario.contacts = Object.values(byId);
  }
}

function renderContactList() {
  const el = document.getElementById('contactList');
  el.innerHTML = '';
  if (!scenario) return;
  for (const c of scenario.contacts) {
    const entry = log[c.contact_id];
    const div = document.createElement('div');
    div.className = 'contact-row' + (entry ? ' selected' : '');
    const classOpts = CLASS_OPTIONS.map(o => `<option value="${o}" ${entry && entry.classification === o ? 'selected' : ''}>${o}</option>`).join('');
    div.innerHTML = `
      <div>Contact ${c.contact_id} ${entry ? `(detected @ ${entry.detected_at.toFixed(1)}s)` : '(not yet detected — click blip)'}</div>
      <select class="cls" onchange="setClassification('${c.contact_id}', this.value)">
        <option value="">classify...</option>${classOpts}
      </select>
      <button onclick="requestAiHint('${c.contact_id}')">AI sensor hint (radar)</button>
      <div class="ai-hint" id="hint-${c.contact_id}" style="font-size:12px;color:#8b949e;margin-top:4px;"></div>
      <div>
        <button onclick="requestSensorRead('${c.contact_id}', 'eo_ir')">EO/IR</button>
        <button onclick="requestSensorRead('${c.contact_id}', 'rf')">RF</button>
        <button onclick="requestSensorRead('${c.contact_id}', 'acoustic')">Acoustic</button>
      </div>
      <div class="sensor-read" id="sensor-${c.contact_id}" style="font-size:12px;color:#8b949e;margin-top:4px;"></div>
      <div>
        <button onclick="setEngagement('${c.contact_id}', 'warn')" ${entry && entry.warn_at !== undefined ? 'style=background:#58a6ff' : ''}>Warn</button>
        <button onclick="setEngagement('${c.contact_id}', 'soft_kill')" ${entry && entry.engagement_action === 'soft_kill' ? 'style=background:#d29922' : ''}>Soft-kill (jam/spoof)</button>
        <button onclick="setEngagement('${c.contact_id}', 'hard_kill')" ${entry && entry.engagement_action === 'hard_kill' ? 'style=background:#f85149' : ''}>Hard-kill (kinetic)</button>
        <button onclick="setEngagement('${c.contact_id}', 'monitor')" ${entry && entry.engagement_action === 'monitor' ? 'style=background:#d29922' : ''}>Monitor</button>
        <button onclick="setEngagement('${c.contact_id}', 'ignore')" ${entry && entry.engagement_action === 'ignore' ? 'style=background:#3fb950' : ''}>Ignore</button>
      </div>`;
    el.appendChild(div);
  }
}

async function requestAiHint(contactId) {
  if (!scenario) return;
  const res = await fetch('/api/contact/classify', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ scenario_id: scenario.scenario_id, contact_id: contactId, t: elapsed }),
  });
  const out = await res.json();
  const el = document.getElementById(`hint-${contactId}`);
  if (el) el.textContent = `sensor model: ${out.label} (p=${out.probabilities[out.label].toFixed(2)}, ${out.source})`;

  // AI trust calibration (roadmap feature 4): record that a hint was asked
  // for and what it said, so scoring can tell whether the trainee's final
  // call followed or overrode it, and whether that was the right call.
  if (!log[contactId]) log[contactId] = { contact_id: contactId, detected_at: elapsed };
  log[contactId].ai_hint_requested = true;
  log[contactId].ai_hint_label = out.label;
}

async function requestSensorRead(contactId, sensor) {
  if (!scenario) return;
  const res = await fetch('/api/contact/sensor_read', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ scenario_id: scenario.scenario_id, contact_id: contactId, t: elapsed, sensor }),
  });
  const out = await res.json();
  const el = document.getElementById(`sensor-${contactId}`);
  if (!el) return;
  if (!out.available) { el.textContent = `${sensor}: ${out.reason}`; return; }
  if (sensor === 'eo_ir') el.textContent = `EO/IR: ${out.detected ? 'shape=' + out.shape_hint : 'no visual contact'} (confidence ${out.confidence})`;
  else if (sensor === 'rf') el.textContent = `RF: ${out.note}`;
  else el.textContent = `Acoustic: ${out.detected ? 'audible' : 'not audible'} (range ${out.range_m}m, effective ${out.effective_range_m}m)`;
}

function showBanner(msg, type = 'info') {
  const el = document.getElementById('statusBanner');
  if (!el) return;
  const bg = type === 'error' ? 'rgba(248, 81, 73, 0.15)' : type === 'warning' ? 'rgba(210, 153, 34, 0.15)' : 'rgba(56, 139, 253, 0.15)';
  const border = type === 'error' ? '#f85149' : type === 'warning' ? '#d29922' : '#58a6ff';
  const color = type === 'error' ? '#ff7b72' : type === 'warning' ? '#e3b341' : '#79c0ff';
  el.style.background = bg;
  el.style.borderBottom = `1px solid ${border}`;
  el.style.color = color;
  el.style.display = 'flex';
  el.innerHTML = `<span>${msg}</span><button onclick="document.getElementById('statusBanner').style.display='none'" style="background:transparent; border:none; color:${color}; font-size:18px; cursor:pointer; padding:0 8px;">&times;</button>`;
}

function closeScoreModal() {
  const modal = document.getElementById('scoreModal');
  if (modal) modal.style.display = 'none';
}

function renderScorecard(result) {
  const modal = document.getElementById('scoreModal');
  const sidebarResult = document.getElementById('result');

  if (result.aar_withheld) {
    const withheldHtml = `
      <div class="score-card">
        <div class="score-header">
          <strong style="color:#58a6ff; font-size:16px;">Session Recorded</strong>
          <button onclick="closeScoreModal()" style="background:transparent; border:none; color:#8b949e; font-size:20px; cursor:pointer;">&times;</button>
        </div>
        <div class="score-body" style="text-align:center; padding:32px;">
          <p style="font-size:15px; line-height:1.6; color:#d7dde3;">${result.message}</p>
          <div style="margin-top:24px; display:flex; justify-content:center; gap:12px;">
            <button onclick="closeScoreModal(); startScenario();" style="background:#238636; color:#fff; border:none; padding:10px 20px; border-radius:6px; font-weight:600; cursor:pointer;">Start Next Scenario</button>
            <button onclick="closeScoreModal()" style="background:#21262d; color:#c9d1d9; border:1px solid #30363d; padding:10px 20px; border-radius:6px; cursor:pointer;">Close</button>
          </div>
        </div>
      </div>`;
    if (modal) { modal.innerHTML = withheldHtml; modal.style.display = 'flex'; }
    if (sidebarResult) sidebarResult.innerHTML = `<div style="color:#58a6ff; padding:8px;">${result.message}</div>`;
    return;
  }

  const score = result.overall_score || 0;
  const gradeColor = score >= 75 ? '#3fb950' : score >= 50 ? '#d29922' : '#f85149';
  const gradeLabel = score >= 85 ? 'A · EXCELLENT' : score >= 70 ? 'B · PROFICIENT' : score >= 50 ? 'C · MARGINAL' : 'F · DEFENSE BREACHED';

  const criticalFlagsHtml = (result.critical_flags && result.critical_flags.length)
    ? result.critical_flags.map(f => `<span style="background:rgba(248,81,73,0.15); border:1px solid #f85149; color:#ff7b72; padding:3px 8px; border-radius:4px; font-size:11px; margin-right:6px; display:inline-block; margin-bottom:4px;">⚠️ ${f}</span>`).join('')
    : '<span style="color:#3fb950; font-weight:600;">✓ Clean ROE Adherence — No Critical Violations</span>';

  const trustHtml = result.ai_trust && result.ai_trust.hints_requested ? `
    <div style="margin-top:14px; padding:10px 14px; background:#161b22; border-radius:6px; border:1px solid #21262d; font-size:12px;">
      <strong style="color:#58a6ff;">AI Sensor Hint Calibration:</strong>
      ${result.ai_trust.hints_requested} requested ·
      Followed: correct ${result.ai_trust.hint_correct_followed}, wrong ${result.ai_trust.hint_wrong_followed} ·
      Overridden: ${result.ai_trust.hint_correct_overridden + result.ai_trust.hint_wrong_overridden}
      ${result.ai_trust.automation_bias_score !== null ? `· Bias: ${(result.ai_trust.automation_bias_score * 100).toFixed(0)}%` : ''}
    </div>` : '';

  const reportBtn = result.session_id ? `
    <a href="/aar/session/${result.session_id}/print" target="_blank" style="padding:9px 16px; background:#161b22; color:#58a6ff; text-decoration:none; border-radius:6px; font-weight:600; border:1px solid #30363d; font-size:13px; display:inline-flex; align-items:center; gap:6px;">🖨️ Printable Report</a>` : '';

  const modalHtml = `
    <div class="score-card">
      <div class="score-header">
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="width:8px; height:8px; border-radius:50%; background:${gradeColor};"></span>
          <strong style="font-size:16px; letter-spacing:0.02em;">AFTER-ACTION EVALUATION SCORECARD</strong>
        </div>
        <button onclick="closeScoreModal()" style="background:transparent; border:none; color:#8b949e; font-size:22px; cursor:pointer; line-height:1;">&times;</button>
      </div>
      <div class="score-body">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:16px 20px; background:#161b22; border:1px solid #30363d; border-radius:10px; margin-bottom:16px;">
          <div>
            <div style="font-size:12px; color:#8b949e; text-transform:uppercase; letter-spacing:0.05em;">Overall Mission Score</div>
            <div style="font-size:36px; font-weight:800; color:${gradeColor}; line-height:1.1; margin-top:2px;">
              ${score.toFixed(1)}<span style="font-size:20px; font-weight:500;">%</span>
            </div>
          </div>
          <div style="text-align:right;">
            <div style="font-size:13px; font-weight:700; color:${gradeColor}; background:${gradeColor}18; border:1px solid ${gradeColor}44; padding:6px 14px; border-radius:20px; display:inline-block;">
              ${gradeLabel}
            </div>
            <div style="font-size:11px; color:#8b949e; margin-top:6px;">Contacts: ${result.contacts_total - result.contacts_missed}/${result.contacts_total} detected (${result.contacts_missed} missed)</div>
          </div>
        </div>

        <div class="metric-grid">
          <div class="metric-item">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#8b949e;">
              <span>🎯 Detection Speed</span>
              <span style="font-weight:700; color:#d7dde3;">${result.detection_score}%</span>
            </div>
            <div class="metric-bar-bg"><div class="metric-bar-fill" style="width:${Math.min(100, result.detection_score)}%; background:#3fb950;"></div></div>
          </div>

          <div class="metric-item">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#8b949e;">
              <span>🔍 Classification</span>
              <span style="font-weight:700; color:#d7dde3;">${result.classification_score}%</span>
            </div>
            <div class="metric-bar-bg"><div class="metric-bar-fill" style="width:${Math.min(100, result.classification_score)}%; background:#58a6ff;"></div></div>
          </div>

          <div class="metric-item">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#8b949e;">
              <span>⚡ ROE & Engagement</span>
              <span style="font-weight:700; color:#d7dde3;">${result.engagement_score}%</span>
            </div>
            <div class="metric-bar-bg"><div class="metric-bar-fill" style="width:${Math.min(100, result.engagement_score)}%; background:#d29922;"></div></div>
          </div>

          <div class="metric-item">
            <div style="display:flex; justify-content:space-between; font-size:12px; color:#8b949e;">
              <span>⏱️ Timeliness Latency</span>
              <span style="font-weight:700; color:#d7dde3;">${result.timeliness_score}%</span>
            </div>
            <div class="metric-bar-bg"><div class="metric-bar-fill" style="width:${Math.min(100, result.timeliness_score)}%; background:#bc8cff;"></div></div>
          </div>
        </div>

        <div style="margin-top:14px; padding:12px 14px; background:#161b22; border-radius:8px; border:1px solid #21262d;">
          <div style="font-size:12px; font-weight:600; color:#8b949e; margin-bottom:6px;">TACTICAL & ROE FLAGS:</div>
          <div>${criticalFlagsHtml}</div>
        </div>

        ${trustHtml}

        <div style="margin-top:20px; display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end; align-items:center;">
          ${reportBtn}
          <a href="/aar" target="_blank" style="padding:9px 18px; background:#238636; color:#fff; text-decoration:none; border-radius:6px; font-weight:700; font-size:13px; display:inline-flex; align-items:center; gap:6px;">📊 Open AAR Dashboard &rarr;</a>
          <button onclick="closeScoreModal(); startScenario();" style="padding:9px 16px; background:#21262d; color:#c9d1d9; border:1px solid #30363d; border-radius:6px; font-weight:600; font-size:13px; cursor:pointer;">🔄 Next Drill</button>
          <button onclick="closeScoreModal()" style="padding:9px 14px; background:transparent; color:#8b949e; border:none; cursor:pointer; font-size:13px;">Dismiss</button>
        </div>
      </div>
    </div>`;

  if (modal) {
    modal.innerHTML = modalHtml;
    modal.style.display = 'flex';
  }

  if (sidebarResult) {
    sidebarResult.innerHTML = `
      <div style="padding:4px 0;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
          <strong style="font-size:18px; color:${gradeColor};">Score: ${score.toFixed(1)}%</strong>
          <span style="font-size:11px; padding:2px 8px; border-radius:10px; background:${gradeColor}22; color:${gradeColor}; border:1px solid ${gradeColor};">${gradeLabel.split(' · ')[0]}</span>
        </div>
        <div style="font-size:12px; color:#8b949e; line-height:1.6;">
          <div>Detection: <strong style="color:#d7dde3;">${result.detection_score}%</strong> · Classify: <strong style="color:#d7dde3;">${result.classification_score}%</strong></div>
          <div>Engage/ROE: <strong style="color:#d7dde3;">${result.engagement_score}%</strong> · Timeliness: <strong style="color:#d7dde3;">${result.timeliness_score}%</strong></div>
          <div>Missed: <strong style="color:${result.contacts_missed ? '#f85149' : '#3fb950'};">${result.contacts_missed}</strong> / ${result.contacts_total}</div>
        </div>
        <div style="margin-top:10px; display:flex; gap:8px;">
          <button onclick="document.getElementById('scoreModal').style.display='flex'" style="padding:5px 10px; font-size:12px; background:#21262d; border:1px solid #30363d; border-radius:4px; color:#58a6ff; cursor:pointer;">View Scorecard</button>
          <a href="/aar" target="_blank" style="padding:5px 10px; font-size:12px; color:#3fb950; text-decoration:none; align-self:center;">AAR Dashboard &rarr;</a>
        </div>
        <details style="margin-top:10px;">
          <summary style="font-size:11px; color:#8b949e; cursor:pointer;">Raw Evaluation JSON</summary>
          <pre style="font-size:11px; max-height:200px; overflow:auto; background:#05070a; padding:8px; border-radius:4px; margin-top:4px;">${JSON.stringify(result, null, 2)}</pre>
        </details>
      </div>`;
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.scrollTop = sidebar.scrollHeight;
  }
}

async function finishSession() {
  const finishBtn = document.getElementById('finishBtn');
  if (!scenario) {
    showBanner("⚠️ No scenario is currently active. Please click 'New procedural scenario' or choose a 'Scripted drill' first.", "warning");
    return;
  }

  if (tickHandle) { clearInterval(tickHandle); tickHandle = null; }
  if (refreshHandle) { clearInterval(refreshHandle); refreshHandle = null; }

  const origHtml = finishBtn.innerHTML;
  finishBtn.disabled = true;
  finishBtn.innerHTML = "⏳ Scoring session...";

  const trainee_id = document.getElementById('traineeId').value || 'trainee-1';
  const unit_id = document.getElementById('unitId').value || 'unit-A';
  const difficulty = parseInt(document.getElementById('difficulty').value);
  const participate_in_research = document.getElementById('participateResearch').checked;

  try {
    const res = await fetch('/api/session/submit', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        scenario_id: scenario.scenario_id, trainee_id, unit_id, difficulty,
        trainee_log: Object.values(log), participate_in_research,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      showBanner(`❌ Scoring Error: ${err.detail || 'Failed to submit session'}`, "error");
      finishBtn.disabled = false;
      finishBtn.innerHTML = origHtml;
      return;
    }

    const result = await res.json();
    finishBtn.disabled = false;
    finishBtn.innerHTML = "Finish &amp; score";
    renderScorecard(result);
  } catch (err) {
    showBanner(`❌ Network error while scoring: ${err.message}`, "error");
    finishBtn.disabled = false;
    finishBtn.innerHTML = origHtml;
  }
}

drawScope();
</script>
