<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="trishulaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38F8D4"/>
      <stop offset="50%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0F243E"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="astraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(32, 32)">
    <!-- Concentric Celestial Radar Halo (Sudarshana ring behind Trishula) -->
    <circle cx="0" cy="0" r="23" fill="none" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="14 6" opacity="0.6"/>
    <circle cx="0" cy="0" r="16" fill="none" stroke="#00E5FF" stroke-width="1.2" opacity="0.3"/>

    <!-- Left Trident Flange / Swept Interceptor Blade -->
    <path d="M -7,6 L -22,-6 L -24,-18 L -17,-12 L -7,-3 Z"
          fill="url(#trishulaGrad)" stroke="#38F8D4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Right Trident Flange / Swept Interceptor Blade -->
    <path d="M 7,6 L 22,-6 L 24,-18 L 17,-12 L 7,-3 Z"
          fill="url(#trishulaGrad)" stroke="#38F8D4" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- Central Astra Spearhead / Main Interceptor Fuselage -->
    <path d="M 0,-27 L 8,-8 L 4,14 L 0,22 L -4,14 L -8,-8 Z"
          fill="#0A192F" stroke="#00E5FF" stroke-width="2.2" stroke-linejoin="round" filter="url(#astraGlow)"/>

    <!-- Internal Glowing Energy Core -->
    <polygon points="0,-16 4,-4 0,4 -4,-4" fill="#38F8D4" filter="url(#astraGlow)"/>
    <circle cx="0" cy="-4" r="1.5" fill="#FFFFFF"/>

    <!-- Lower Defensive Guard Arc -->
    <path d="M -16,14 Q 0,26 16,14" fill="none" stroke="#00E5FF" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
