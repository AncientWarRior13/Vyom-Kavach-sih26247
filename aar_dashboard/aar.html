<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AAR Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.1/chart.umd.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; background: #0e1117; color: #e6e6e6; margin: 0; padding: 24px; }
  h1 { font-size: 20px; }
  .row { display: flex; gap: 16px; flex-wrap: wrap; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; flex: 1; min-width: 280px; }
  input, button { background: #0e1117; color: #e6e6e6; border: 1px solid #30363d; border-radius: 4px; padding: 6px 10px; }
  button { cursor: pointer; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 13px; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #30363d; }
  .flag { color: #e06666; }
</style>
</head>
<body>
  <h1>After-Action Review</h1>
  <p><a href="/trainer" style="color:#58a6ff">&larr; Trainee view</a> &nbsp; <a href="/instructor" style="color:#58a6ff">Instructor console &rarr;</a></p>
  <div class="row">
    <input id="traineeId" placeholder="trainee id" />
    <input id="unitId" placeholder="unit id" />
    <button onclick="loadAll()">Load</button>
    <a id="csvLink" href="#" style="color:#58a6ff; align-self:center;">Export CSV</a>
    <button onclick="checkAuditChain()">Verify audit chain</button>
    <span id="auditStatus" style="align-self:center; font-size:12px;"></span>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="card">
      <h3>Trainee performance over sessions</h3>
      <canvas id="traineeChart" height="180"></canvas>
      <div id="certBadge" style="margin-top:8px; font-weight:bold;"></div>
    </div>
    <div class="card">
      <h3>Unit leaderboard (avg score)</h3>
      <canvas id="unitChart" height="180"></canvas>
      <div id="unitCertBadge" style="margin-top:8px; font-weight:bold;"></div>
    </div>
  </div>

  <div class="row" style="margin-top:16px">
    <div class="card">
      <h3>Error taxonomy (roadmap feature 9)</h3>
      <table id="taxonomyTable"><thead><tr><th>Flag type</th><th>Count</th></tr></thead><tbody></tbody></table>
    </div>
    <div class="card">
      <h3>Missed-contact heatmap</h3>
      <canvas id="heatmapCanvas" width="300" height="300" style="background:#05070a; width:100%; max-width:300px;"></canvas>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <h3>Recent sessions</h3>
    <table id="sessionsTable">
      <thead><tr><th>Time</th><th>Trainee</th><th>Difficulty</th><th>Overall</th><th>Detect</th><th>Classify</th><th>Engage</th><th>Timeliness</th><th>Missed</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

<script>
let traineeChart, unitChart;

async function loadAll() {
  const traineeId = document.getElementById('traineeId').value.trim();
  const unitId = document.getElementById('unitId').value.trim();
  document.getElementById('csvLink').href = `/api/aar/export.csv?trainee_id=${encodeURIComponent(traineeId)}&unit_id=${encodeURIComponent(unitId)}`;

  const sessions = await fetch(`/api/aar/sessions?trainee_id=${encodeURIComponent(traineeId)}&unit_id=${encodeURIComponent(unitId)}`).then(r => r.json());
  const tbody = document.querySelector('#sessionsTable tbody');
  tbody.innerHTML = '';
  for (const s of sessions) {
    const timeliness = JSON.parse(s.result_json || '{}').timeliness_score ?? '-';
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${s.created_at}</td><td>${s.trainee_id}</td><td>${s.difficulty}</td>
      <td>${s.overall_score}</td><td>${s.detection_score}</td><td>${s.classification_score}</td>
      <td>${s.engagement_score}</td><td>${timeliness}</td>
      <td class="${s.contacts_missed ? 'flag' : ''}">${s.contacts_missed}</td>
      <td><a href="/aar/session/${s.id}/print" target="_blank" style="color:#58a6ff">report</a></td>`;
    tbody.appendChild(tr);
  }

  const taxonomy = await fetch(`/api/aar/error_taxonomy?trainee_id=${encodeURIComponent(traineeId)}&unit_id=${encodeURIComponent(unitId)}`).then(r => r.json());
  const taxBody = document.querySelector('#taxonomyTable tbody');
  taxBody.innerHTML = '';
  for (const [flag, count] of Object.entries(taxonomy)) {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${flag}</td><td>${count}</td>`;
    taxBody.appendChild(tr);
  }

  const points = await fetch(`/api/aar/missed_heatmap?trainee_id=${encodeURIComponent(traineeId)}&unit_id=${encodeURIComponent(unitId)}`).then(r => r.json());
  drawHeatmap(points);

  if (traineeId) {
    const cert = await fetch(`/api/aar/certification/${encodeURIComponent(traineeId)}`).then(r => r.json());
    const badge = document.getElementById('certBadge');
    badge.style.color = cert.certified ? '#3fb950' : '#e06666';
    badge.textContent = cert.avg_score === null ? 'No sessions yet'
      : `${cert.certified ? 'CERTIFIED' : 'NOT CERTIFIED'} — avg ${cert.avg_score} over last ${cert.sessions_counted}/${cert.window} sessions (threshold ${cert.threshold})`;
  }
  if (unitId) {
    const unitCert = await fetch(`/api/aar/certification/unit/${encodeURIComponent(unitId)}`).then(r => r.json());
    document.getElementById('unitCertBadge').textContent = unitCert.total_trainees
      ? `${unitCert.certified_count}/${unitCert.total_trainees} trainees certified (${Math.round(unitCert.certification_rate*100)}%)`
      : 'No trainees in this unit yet';
  }

  if (traineeId) {
    const trend = await fetch(`/api/aar/trend/trainee/${encodeURIComponent(traineeId)}`).then(r => r.json());
    const labels = trend.map(t => t.created_at);
    if (traineeChart) traineeChart.destroy();
    traineeChart = new Chart(document.getElementById('traineeChart'), {
      type: 'line',
      data: {
        labels,
        datasets: [
          { label: 'Overall', data: trend.map(t => t.overall_score), borderColor: '#58a6ff' },
          { label: 'Detection', data: trend.map(t => t.detection_score), borderColor: '#3fb950' },
          { label: 'Classification', data: trend.map(t => t.classification_score), borderColor: '#d29922' },
          { label: 'Engagement', data: trend.map(t => t.engagement_score), borderColor: '#f85149' },
        ],
      },
      options: { responsive: true, scales: { y: { min: 0, max: 100 } } },
    });
  }

  if (unitId) {
    const trend = await fetch(`/api/aar/trend/unit/${encodeURIComponent(unitId)}`).then(r => r.json());
    if (unitChart) unitChart.destroy();
    unitChart = new Chart(document.getElementById('unitChart'), {
      type: 'bar',
      data: {
        labels: trend.map(t => t.trainee_id),
        datasets: [{ label: 'Avg score', data: trend.map(t => t.avg_score), backgroundColor: '#58a6ff' }],
      },
      options: { responsive: true, scales: { y: { min: 0, max: 100 } } },
    });
  }
}

async function checkAuditChain() {
  const el = document.getElementById('auditStatus');
  el.textContent = 'checking...';
  const r = await fetch('/api/audit/verify_chain').then(r => r.json());
  el.style.color = r.valid ? '#3fb950' : '#e06666';
  el.textContent = r.valid
    ? `Chain intact (${r.sessions_checked} sessions)`
    : `TAMPERED — broken at session ${r.broken_at_session_id}`;
}

function drawHeatmap(points) {
  const canvas = document.getElementById('heatmapCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!points.length) return;
  const xs = points.map(p => p.x), ys = points.map(p => p.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs, minX + 1);
  const minY = Math.min(...ys), maxY = Math.max(...ys, minY + 1);
  for (const p of points) {
    const px = ((p.x - minX) / (maxX - minX)) * canvas.width;
    const py = ((p.y - minY) / (maxY - minY)) * canvas.height;
    const grad = ctx.createRadialGradient(px, py, 0, px, py, 24);
    grad.addColorStop(0, 'rgba(248,81,73,0.5)');
    grad.addColorStop(1, 'rgba(248,81,73,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(px - 24, py - 24, 48, 48);
  }
}

loadAll();
</script>
</body>
</html>
