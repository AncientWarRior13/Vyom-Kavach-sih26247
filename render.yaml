services:
  - type: web
    name: dronethreattrainer-api
    env: python
    plan: free
    region: oregon
    buildCommand: "./render-build.sh"
    startCommand: "python -m uvicorn server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DRONETHREATTRAINER_ALLOW_REMOTE
        value: "1"
      - key: PORT
        value: 10000
