    <text x="0" y="24" class="hand-subtitle">Smart India Hackathon 2026 (PS-247) • Micro-Doppler Radar DSP, ONNX Threat Classification, C2 Deck &amp; Hash Ledger</text>
  </g>

  <!-- ======================================================== -->
