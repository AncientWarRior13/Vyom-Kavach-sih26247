    <path d="M 347 268 L 347 380 L 315 380 L 315 408" fill="none" stroke="#262626" stroke-width="2.2" stroke-linecap="round" marker-end="url(#arrow)"/>
    <rect x="270" y="328" width="155" height="22" rx="5" fill="#FEE388"/>
    <text x="347" y="339" class="edge-label">Micro-Doppler Jitter</text>

