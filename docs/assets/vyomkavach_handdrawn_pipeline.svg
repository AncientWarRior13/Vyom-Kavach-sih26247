<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 900" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Patrick+Hand&amp;family=Caveat:wght@600&amp;display=swap');
      
      text {
        font-family: 'Patrick Hand', 'Caveat', 'Virgil', 'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .hand-title {
        font-size: 28px;
        font-weight: 700;
        fill: #18181B;
      }
      .hand-subtitle {
        font-size: 15px;
        fill: #52525B;
      }
      .container-title {
        font-size: 26px;
        font-weight: 700;
        fill: #18181B;
      }
      .node-text-lg {
        font-size: 18px;
        font-weight: 700;
        fill: #18181B;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .node-text-md {
        font-size: 16px;
        font-weight: 700;
        fill: #18181B;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .node-text-sub {
        font-size: 12.5px;
        fill: #3F3F46;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .edge-label {
        font-size: 14px;
        font-weight: 700;
        fill: #18181B;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .edge-label-red {
        font-size: 13.5px;
        font-weight: 700;
        fill: #B91C1C;
        text-anchor: middle;
        dominant-baseline: central;
      }
      .badge-tag {
        font-size: 14px;
        font-weight: 700;
        fill: #18181B;
        text-anchor: middle;
        dominant-baseline: central;
      }
    </style>

    <!-- Hand-drawn charcoal arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#262626" stroke="#262626" stroke-width="1" stroke-linejoin="round"/>
    </marker>
    <!-- Red feedback loop marker -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#DC2626" stroke="#DC2626" stroke-width="1" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Clean Off-White Background -->
  <rect width="1320" height="900" rx="16" fill="#F4F4F6"/>
  <rect width="1320" height="900" rx="16" fill="none" stroke="#D4D4D8" stroke-width="1.5"/>

  <!-- Header Banner -->
  <g transform="translate(50, 42)">
